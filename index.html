<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Seating Pro V2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <button class="mobile-menu-btn" id="mobile-menu-toggle">☰</button>
        <h1>WeddingPlanner</h1>
      </div>
      <div class="header-actions">
        <button class="btn btn-icon" id="btn-settings" title="Настройки тегов">⚙️</button>
        <button class="btn btn-secondary" id="btn-export">Экспорт Excel</button>
        <button class="btn btn-primary" id="btn-share">Поделиться (Скриншот)</button>
      </div>
    </header>

    <!-- Sidebar (Guests & Tables) -->
    <aside class="sidebar" id="sidebar">
      <div class="tabs">
        <button class="tab active" data-target="guests">Гости</button>
        <button class="tab" data-target="tables">Столы</button>
      </div>
      
      <div class="tab-content active" id="tab-guests">
        <div class="search-bar">
          <input type="text" id="search-guests" placeholder="Поиск гостей...">
        </div>
        <button class="btn btn-primary full-width" id="btn-add-guest">+ Новый гость</button>
        <div class="guest-list" id="guest-list"></div>
      </div>

      <div class="tab-content" id="tab-tables">
        <div class="table-actions">
          <button class="btn btn-secondary full-width" id="btn-add-round-table">⚪ Круглый стол</button>
          <button class="btn btn-secondary full-width" id="btn-add-rect-table">▭ Прямоугольный</button>
        </div>
        <div class="table-list" id="table-list"></div>
      </div>
    </aside>

    <!-- Main Canvas Area -->
    <main class="canvas-area" id="canvas-wrapper">
      <div class="canvas-container" id="canvas-container">
        <svg id="hall-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
          <defs>
            <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#cbd5e1" flood-opacity="0.5"/>
            </filter>
          </defs>
          <g id="svg-landmark"></g>
          <g id="svg-tables"></g>
        </svg>
      </div>
      <div class="zoom-controls">
        <button class="btn-zoom" id="btn-zoom-in">+</button>
        <button class="btn-zoom" id="btn-zoom-reset">100%</button>
        <button class="btn-zoom" id="btn-zoom-out">-</button>
      </div>
    </main>
  </div>

  <!-- Drag Ghost -->
  <div id="drag-ghost" class="drag-ghost"></div>

  <!-- Modals -->
  <div class="modal-overlay" id="modal-overlay">
    
    <!-- Guest Edit Modal -->
    <div class="modal" id="modal-guest">
      <h2 id="guest-modal-title">Редактировать гостя</h2>
      <div class="input-group">
        <label>Имя и фамилия</label>
        <input type="text" id="inp-guest-name" placeholder="Иван Иванов">
      </div>
      <div class="input-group">
        <label>Группа / Тег (определяет цвет)</label>
        <select id="inp-guest-tag"></select>
      </div>
      <div class="input-group">
        <label>Статус</label>
        <select id="inp-guest-status">
          <option value="Принято">✅ Принято</option>
          <option value="Под вопросом">❓ Под вопросом</option>
          <option value="Отклонено">❌ Отклонено</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="btn-guest-delete">Удалить</button>
        <div class="footer-right">
          <button class="btn btn-text btn-cancel">Отмена</button>
          <button class="btn btn-primary" id="btn-guest-save">Сохранить</button>
        </div>
      </div>
    </div>

    <!-- Table Edit Modal -->
    <div class="modal" id="modal-table">
      <h2>Настройки стола</h2>
      <div class="input-group">
        <label>Название</label>
        <input type="text" id="inp-table-name">
      </div>
      <div class="input-group" style="display: flex; gap: 16px;">
        <div style="flex: 1;">
          <label>Мест</label>
          <input type="number" id="inp-table-seats" min="1" max="24">
        </div>
        <div style="flex: 1;">
          <label>Поворот (°)</label>
          <input type="number" id="inp-table-rotation" step="15" value="0">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="btn-table-delete">Удалить стол</button>
        <div class="footer-right">
          <button class="btn btn-text btn-cancel">Отмена</button>
          <button class="btn btn-primary" id="btn-table-save">Сохранить</button>
        </div>
      </div>
    </div>

    <!-- Tags Settings Modal -->
    <div class="modal" id="modal-tags">
      <h2>Настройка групп и цветов</h2>
      <p class="modal-subtitle">Эти цвета используются для мест на плане рассадки.</p>
      <div id="tags-list" class="tags-editor-list"></div>
      <button class="btn btn-secondary full-width" id="btn-add-tag">+ Добавить группу</button>
      <div class="modal-footer" style="margin-top: 24px;">
        <button class="btn btn-text btn-cancel" style="margin-left: auto;">Закрыть</button>
      </div>
    </div>

    <!-- Seat Action Modal -->
    <div class="modal" id="modal-seat-action">
      <h2 id="seat-action-title">Действие</h2>
      <div class="seat-action-buttons">
        <button class="btn btn-primary full-width" id="btn-seat-swap">🔄 Заменить гостя</button>
        <button class="btn btn-secondary full-width" id="btn-seat-question">❓ Под вопросом</button>
        <button class="btn btn-danger full-width" id="btn-seat-unseat">Убрать с места</button>
      </div>
      <button class="btn btn-text btn-cancel full-width" style="margin-top: 12px;">Отмена</button>
    </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
